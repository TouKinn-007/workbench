<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>暴躁汤的工作台</title>
<meta name="theme-color" content="#e8603c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="暴躁汤">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f7;--card:#fff;--accent:#e8603c;--text:#1a1a1a;
  --gray:#999;--darkgray:#aaa;--border:#e8e8e8;
  --shadow:0 1px 8px rgba(0,0,0,.06);--blue:#4285f4;--green:#34a853;--red:#e8603c;
  --sidebar-bg:#fafafa;--sidebar-w:96px;
}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* 顶栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.topbar .date{font-size:11px;color:var(--gray);margin-top:1px}
.daily-rate{font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;background:#f0f0f2}
.syncbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:#eef4ff;border-bottom:1px solid var(--border);flex-shrink:0}
.sync-status{font-size:12px;color:#4285f4;font-weight:600;margin-right:auto}
.sync-btn{font-size:12px;padding:4px 12px;border:1px solid #bcd2ff;background:#fff;color:#4285f4;border-radius:6px;cursor:pointer;font-family:inherit}
.sync-btn:hover{background:#f0f6ff}

/* 左右布局 */
.main-layout{display:flex;flex:1;min-height:0}

/* 左侧 Tab */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:8px;overflow-y:auto;flex-shrink:0;position:sticky;top:0;align-self:flex-start;max-height:100vh}
.tab-btn{display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;border:none;background:transparent;color:var(--text);font-size:12px;font-weight:500;transition:all .2s;position:relative;font-family:inherit;gap:3px}
.tab-btn .tab-icon{font-size:20px;line-height:1}
.tab-btn .tab-label{font-size:11px;white-space:nowrap}
.tab-btn:hover{background:#edeef0}
.tab-btn.active{background:var(--card);color:var(--accent)}
.tab-btn.active::after{content:'';position:absolute;right:0;top:16%;height:68%;width:3px;background:var(--accent);border-radius:2px 0 0 2px}

/* 右侧内容 */
.content-area{flex:1;display:flex;flex-direction:column;padding:12px 16px 16px;min-height:0}

/* === 通用任务样式 === */
.task-item{position:relative;overflow:hidden;background:var(--card);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);transition:all .25s}
.task-item.swiping{transition:none}
.task-content{display:flex;align-items:flex-start;padding:12px 14px;gap:10px;position:relative;z-index:2;background:var(--card);min-height:48px}
.task-checkbox{width:18px;height:18px;border:2px solid var(--border);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-top:2px}
.task-checkbox.checked{background:var(--accent);border-color:var(--accent)}
.task-checkbox.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.task-checkbox.blue-check{background:var(--blue);border-color:var(--blue)}
.task-checkbox.blue-check::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.task-checkbox.red-check{background:var(--red);border-color:var(--red)}
.task-checkbox.red-check::after{content:'✗';color:#fff;font-size:12px;font-weight:700}
.task-checkbox.incomplete{background:#fff;border-color:var(--red)}
.task-checkbox.incomplete::after{content:'×';color:var(--red);font-size:15px;font-weight:700}
.task-item.incomplete-state{background:#fff5f5}
.task-item.incomplete-state .task-content{background:#fff5f5}
.subtask-item .task-checkbox.incomplete{background:#fff;border-color:var(--red)}
.subtask-item .task-checkbox.incomplete::after{content:'×';color:var(--red);font-size:13px;font-weight:700}
.task-text{font-size:14px;line-height:1.5;transition:all .3s;flex:1;cursor:pointer}
.task-text.done{text-decoration:line-through;color:var(--darkgray)}
.task-text.incomplete{color:var(--red)}
.task-note-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;font-family:inherit;resize:none;margin-top:4px;transition:border-color .2s}
.task-note-input:focus{border-color:var(--accent)}
.task-note-input::placeholder{color:#ccc}
.delete-zone{position:absolute;right:12px;top:10px;height:28px;width:48px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;z-index:1;cursor:pointer;border-radius:0 8px 8px 0;box-shadow:0 2px 6px rgba(232,96,60,.3)}

/* 子任务 */
.subtask-list{padding:0 14px 8px 42px}
.subtask-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;position:relative}
.subtask-item .task-checkbox{width:16px;height:16px;border-radius:3px;margin-top:0}
.subtask-item .subtask-text{flex:1;transition:all .3s}
.subtask-item .subtask-text.done{text-decoration:line-through;color:var(--darkgray)}
.subtask-add{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;color:var(--gray);cursor:pointer;margin-left:42px}
.subtask-add:hover{color:var(--accent)}
.subtask-add input{flex:1;border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;outline:none;font-family:inherit}
.sub-del{width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#bbb;cursor:pointer;margin-left:4px;transition:color .15s}
.sub-del:hover{color:#888}

/* 健康饮食特殊样式 */
.health-row{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.health-tag{display:flex;align-items:center;gap:4px;font-size:13px}
.health-tag .label{font-weight:500}
.health-tag .tag-check{width:16px;height:16px;border:2px solid var(--border);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.health-tag .tag-check.blue{background:var(--blue);border-color:var(--blue)}
.health-tag .tag-check.blue::after{content:'✓';color:#fff;font-size:10px;font-weight:700}
.health-tag .tag-check.red{background:var(--red);border-color:var(--red)}
.health-tag .tag-check.red::after{content:'✗';color:#fff;font-size:10px;font-weight:700}
.weight-input{display:flex;align-items:center;gap:6px;font-size:13px}
.weight-input input{width:70px;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px;outline:none;font-family:inherit;text-align:center;-moz-appearance:textfield}
.weight-input input::-webkit-inner-spin-button,.weight-input input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.weight-input .weight-arrow{font-size:12px;font-weight:700}
.weight-arrow.up{color:var(--red)}
.weight-arrow.down{color:var(--blue)}
.weight-arrow.flat{color:#333}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:20px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.15);animation:slideUp .25s}
.modal h2{font-size:16px;font-weight:700;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal-actions button{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-family:inherit;font-weight:500}
.btn-cancel{background:#eee;color:var(--text)}
.btn-confirm{background:var(--accent);color:#fff}

/* 统计弹窗 */
.stats-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:center;justify-content:center}
.stats-overlay.show{display:flex}
.stats-card{background:var(--card);border-radius:14px;padding:24px;width:90%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center;animation:slideUp .25s}
.stats-card .task-name{font-size:16px;font-weight:700;margin-bottom:16px}
.stats-card .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stats-card .stat-box{background:#f5f5f7;border-radius:10px;padding:12px;text-align:center}
.stats-card .stat-box .val{font-size:20px;font-weight:700;color:var(--accent)}
.stats-card .stat-box .lbl{font-size:11px;color:var(--gray);margin-top:2px}
.stats-card .rate-bar{height:8px;background:#eee;border-radius:4px;margin:12px 0 4px;overflow:hidden}
.stats-card .rate-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.stats-card .rate-label{font-size:12px;color:var(--gray)}

/* 图表区 */
.chart-section{background:var(--card);border-radius:10px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-nav{display:flex;align-items:center;gap:8px}
.chart-nav-btn{width:28px;height:28px;border-radius:6px;background:#eee;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit}
.chart-nav-btn:hover{background:#ddd}
.chart-period{font-size:12px;color:var(--gray);min-width:80px;text-align:center}
.chart-tabs{display:flex;gap:6px;margin-bottom:10px}
.chart-tab{padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;background:#eee;border:none;font-family:inherit;color:var(--text)}
.chart-tab.active{background:var(--accent);color:#fff}
.chart-container{position:relative;width:100%;aspect-ratio:2/1;max-height:260px}
.chart-container svg{width:100%;height:100%;display:block}

/* 空状态 */
.empty-state{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-state .icon{font-size:36px;margin-bottom:8px;opacity:.4}
.empty-state p{font-size:13px}

/* 备注区 */
.notes-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.notes-section label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px;font-weight:500}
.notes-box{width:100%;min-height:56px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;line-height:1.5;resize:vertical;font-family:inherit;background:var(--card);outline:none;transition:border-color .2s}
.notes-box:focus{border-color:var(--accent)}

/* Placeholder tab */
.placeholder{display:flex;flex-direction:column;align-items:center;padding:32px 20px;text-align:center;color:var(--gray)}
.placeholder .icon{font-size:48px;opacity:.4;margin-bottom:12px}
.placeholder h2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.placeholder p{font-size:13px;line-height:1.6;max-width:320px}
.placeholder .feature-list{margin-top:16px;text-align:left;font-size:13px;line-height:2}
.placeholder .feature-list li::marker{color:var(--accent)}

.add-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 2px 8px rgba(232,96,60,.3)}
.add-btn:hover{transform:scale(1.1)}
.add-btn:active{transform:scale(.95)}

@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(60px);opacity:0}}
.task-item.removing{animation:slideOut .25s forwards}

@media(max-width:480px){
  .sidebar{width:68px}
  .tab-btn .tab-label{font-size:10px}
  .tab-btn .tab-icon{font-size:16px}
  .content-area{padding:10px 12px 14px}
}

/* 英语学习 Tab */
.en-subnav{display:flex;gap:6px;margin-bottom:14px}
.en-subnav button{flex:1;padding:9px 4px;border:1px solid var(--border);background:var(--card);color:var(--gray);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.en-subnav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.en-head{font-size:14px;color:var(--gray);margin-bottom:12px;line-height:1.6}
.en-head a{color:var(--accent);text-decoration:none}
.en-lesson{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);animation:slideUp .25s}
.en-lesson .en-sentence{font-size:15px;font-weight:600;line-height:1.65;color:var(--text);margin-bottom:6px}
.en-lesson .en-zh{font-size:13px;color:var(--gray);line-height:1.65;margin-bottom:10px}
.en-lesson .sec-title{font-size:12px;font-weight:700;color:var(--accent);margin:12px 0 6px;letter-spacing:.5px}
.en-word{border-left:3px solid var(--accent);padding:6px 10px;background:#f7f3ff;border-radius:0 8px 8px 0;margin-bottom:8px}
.en-word .w{font-weight:700;color:var(--text);font-size:13px}
.en-word .m{font-size:12.5px;color:var(--text);line-height:1.5}
.en-word .ex{font-size:12px;color:var(--gray);line-height:1.5;margin-top:2px;font-style:italic}
.en-grammar{font-size:13px;line-height:1.7;background:#fff7f3;border-radius:8px;padding:10px;color:var(--text)}
.en-test-q{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);animation:slideUp .25s}
.en-test-q .q{font-size:14px;font-weight:600;line-height:1.65;margin-bottom:10px}
.en-opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);font-size:13px;cursor:pointer;margin-bottom:8px;transition:all .15s;color:var(--text)}
.en-opt:hover{border-color:var(--accent)}
.en-opt.correct{background:#e3f7e8;border-color:#37a95a;color:#1d7a3a;font-weight:600}
.en-opt.wrong{background:#fde8e8;border-color:#e0584e;color:#b22;font-weight:600}
.en-opt:disabled{cursor:default}
.en-explain{font-size:12.5px;line-height:1.65;background:#f0f4ff;border-radius:8px;padding:9px;margin-top:4px;color:var(--text)}
.en-score{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.en-empty{text-align:center;color:var(--gray);font-size:13px;padding:30px}

/* 同步状态隐藏（30秒自动同步不再展示） */
.sync-status{display:none}
/* 禁用原生下拉刷新，改为自定义下拉=同步 */
html,body{overscroll-behavior-y:contain}
.content-area{position:relative;overscroll-behavior-y:contain}

/* 每个 Tab 的日期选择器 */
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.date-input{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);outline:none}
.date-today{padding:6px 10px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.date-tag{font-size:11px;color:#e8603c;background:#fdecea;padding:3px 8px;border-radius:10px}
.rev-readonly{background:#fafafa;color:#999}

/* 下拉同步提示 + Toast */
.pull-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%);text-align:center;color:var(--gray);font-size:12px;padding:8px 14px;background:rgba(255,255,255,.92);border-radius:0 0 12px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:opacity .2s;z-index:900;pointer-events:none}
.pull-indicator.show{opacity:1}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* 英语学习：已学/已跟读徽标、挖空、跟读 */
.en-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;cursor:pointer;user-select:none}
.en-badge.off{background:#f0f0f0;color:#999}
.en-badge.on{background:#e3f7e8;color:#1d7a3a}
.en-subhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.en-cloze-input,.en-zh-input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:8px;box-sizing:border-box;outline:none;color:var(--text)}
.en-cloze-input:focus,.en-zh-input:focus{border-color:var(--accent)}
.en-sentence .blank{color:var(--accent);font-weight:700}
.en-shadow-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.en-play{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.en-play:disabled{background:#ccc;cursor:not-allowed}
.en-submit{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.en-cloze-input.ok,.en-zh-input.ok{border-color:#37a95a;background:#f1f8f1}
.en-cloze-input.wrong,.en-zh-input.wrong{border-color:#e0584e;background:#fdecec}
.en-key{display:inline-block;background:#f0f4ff;color:var(--accent);font-size:11px;padding:2px 7px;border-radius:8px;margin:0 3px;font-weight:600}
.en-badge{cursor:default}
button.en-badge{cursor:pointer}
.en-tag{display:inline-block;background:#f0f0f0;color:#999;font-size:10px;font-weight:600;padding:2px 8px;border-radius:9px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<div class="topbar">
  <div><h1>暴躁汤的工作台</h1><div class="date" id="dateDisplay"></div></div>
</div>
<div class="syncbar" id="syncbar" style="display:none">
  <span class="sync-status" id="syncStatus">☁ 自动同步中</span>
  <button class="sync-btn" onclick="openSyncSettings()">设置</button>
  <button class="sync-btn" onclick="exportData()">导出</button>
  <button class="sync-btn" onclick="document.getElementById('importFile').click()">导入</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
</div>

<div class="main-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-area" id="contentArea"></div>
</div>

<!-- 添加任务弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">添加任务</h2>
    <input type="text" id="taskInput" placeholder="输入任务内容..." maxlength="120">
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">取消</button>
      <button class="btn-confirm" id="confirmBtn">添加</button>
    </div>
  </div>
</div>

<!-- 统计弹窗 -->
<div class="stats-overlay" id="statsOverlay">
  <div class="stats-card" id="statsCard"></div>
</div>

<script>
// === 工具 ===
const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const WEEKDAYS = ['日','一','二','三','四','五','六'];
document.getElementById('dateDisplay').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 周${WEEKDAYS[now.getDay()]}`;

// 本机编辑时间戳：记录各键最近一次被本机用户修改的时间（同设备时钟，不受跨设备时钟偏差影响）
function getLocalEdit(){ try{ return JSON.parse(localStorage.getItem('wb_local_edit')||'{}')||{}; }catch{ return {}; } }
function markLocalEdit(k){ if(!k || k.indexOf('wb_sync')===0 || k==='wb_last_sync') return; let m=getLocalEdit(); m[k]=Date.now(); try{ localStorage.setItem('wb_local_edit', JSON.stringify(m)); }catch{} }
function ls(k,v){ if(v!==undefined){localStorage.setItem(k,JSON.stringify(v)); markLocalEdit(k); if(_syncing) _needResync=true; syncMarkDirty();}else{try{return JSON.parse(localStorage.getItem(k))}catch{return null}} }
function lsRaw(k,v){ if(v!==undefined){ localStorage.setItem(k,v); markLocalEdit(k); syncMarkDirty(); } else return localStorage.getItem(k)||''; }

// ============ 同步层（GitHub Gist 合并同步）============
// 任意 http(s) 环境（云端部署 / 穿透 / localhost）启用；file:// 纯本地。
const SYNC = location.protocol.startsWith('http');
const GH_API = 'https://api.github.com';
// 同步后端：GitHub 仓库文件（细粒度 Token 需对仓库有 Contents 读写权限）
const SYNC_OWNER = 'TouKinn-007';
const SYNC_REPO = 'workbench';
const SYNC_BRANCH = 'sync-data';
const SYNC_PATH = 'sync/workbench-data.json';
function getCfg(){
  try{
    let c = JSON.parse(localStorage.getItem('wb_sync_cfg')||'{}');
    return c && typeof c==='object' ? c : {};
  }catch{ return {}; }
}
function setCfg(c){ localStorage.setItem('wb_sync_cfg', JSON.stringify(c)); }

// 深合并两个对象/数组（数组按索引逐项合并，对象递归，标量取较新/云端优先）
// 域感知合并：避免云端空值覆盖本地刚输入的内容
function isPlanItem(o){ return o && typeof o==='object' && !Array.isArray(o) && 'state' in o && 'note' in o && !('text' in o) && !('children' in o); }
function mergePlanItem(a,b){
  let ats = Number(a.stateTs||0), bts = Number(b.stateTs||0);
  let state = (ats>=bts) ? Number(a.state||0) : Number(b.state||0);
  let an = a.note==null?'':String(a.note), bn = b.note==null?'':String(b.note);
  let ants = Number(a.noteTs||0), bnts = Number(b.noteTs||0);
  let note = (ants>bnts) ? an : (bnts>ants) ? bn : (an!==''?an:bn);
  return { state, note, stateTs: Math.max(ats,bts), noteTs: Math.max(ants,bnts) };
}
function isHealthItem(o){ return o && typeof o==='object' && !Array.isArray(o) && ('noSnack' in o || 'weight' in o); }
function mergeHealthItem(a,b){
  let atsN=Number(a.noSnackTs||0), btsN=Number(b.noSnackTs||0);
  let atsI=Number(a.intermittentTs||0), btsI=Number(b.intermittentTs||0);
  let atsW=Number(a.weightTs||0), btsW=Number(b.weightTs||0);
  let aw=(a.weight==null||isNaN(Number(a.weight)))?null:Number(a.weight);
  let bw=(b.weight==null||isNaN(Number(b.weight)))?null:Number(b.weight);
  let weight;
  if(atsW>btsW) weight=aw;
  else if(btsW>atsW) weight=bw;
  else weight = (aw!=null)?aw:bw;   // 平手：优先保留已填数值，避免清空
  return {
    noSnack: (atsN>=btsN)? !!a.noSnack : !!b.noSnack,
    intermittent: (atsI>=btsI)? !!a.intermittent : !!b.intermittent,
    weight,
    noSnackTs: Math.max(atsN,btsN),
    intermittentTs: Math.max(atsI,btsI),
    weightTs: Math.max(atsW,btsW)
  };
}
function deepObjMerge(a,b){
  if(Array.isArray(a) && Array.isArray(b)){
    let len = Math.max(a.length, b.length);
    let out = [];
    for(let i=0;i<len;i++){
      let av=a[i], bv=b[i];
      if(av===undefined) out[i]=bv;
      else if(bv===undefined) out[i]=av;
      else if(av&&typeof av==='object'&&bv&&typeof bv==='object'&&!Array.isArray(av)&&!Array.isArray(bv)){
        if(isPlanItem(av)&&isPlanItem(bv)) out[i]=mergePlanItem(av,bv);
        else if(isHealthItem(av)&&isHealthItem(bv)) out[i]=mergeHealthItem(av,bv);
        else out[i]=deepObjMerge(av,bv);
      }
      else if(Array.isArray(av)&&Array.isArray(bv)) out[i]=deepObjMerge(av,bv);
      else out[i]=bv;
    }
    return out;
  }
  let out = Array.isArray(a) ? [...a] : (a&&typeof a==='object' ? {...a} : {});
  for(let k in b){
    let av=a[k], bv=b[k];
    if(av&&typeof av==='object'&&bv&&typeof bv==='object'&&!Array.isArray(av)&&!Array.isArray(bv)) out[k]=deepObjMerge(av,bv);
    else if(Array.isArray(av)&&Array.isArray(bv)) out[k]=deepObjMerge(av,bv);
    else out[k]=bv;
  }
  return out;
}
// 把可能损坏的 plan_history 规范化成 { 'YYYY-MM-DD': [ {state,note} ] }
function normalizePlanHistory(o){
  if(!o || typeof o !== 'object') return {};
  if(Array.isArray(o)){
    // 旧损坏：整条是数组。状态不可信，只保留笔记。
    return { [TODAY]: o.map(t=>({state:0, note:(t&&t.note)||'' , stateTs:0, noteTs:0})) };
  }
  let out = {};
  for(let k in o){
    if(!DATE_KEY_RE.test(k)) continue;
    let arr = o[k];
    if(!Array.isArray(arr)){
      out[k] = PLAN_TASKS.slice(0,6).map(()=>({state:0,note:'',stateTs:0,noteTs:0}));
      continue;
    }
    // 过滤数组项：必须是 {state,note} 对象，不能含日期键
    out[k] = arr.map(t=>{
      if(!t || typeof t !== 'object' || Array.isArray(t) || Object.keys(t).some(kk=>DATE_KEY_RE.test(kk))){
        return {state:0, note:'', stateTs:0, noteTs:0};
      }
      return {state: Number(t.state)||0, note: t.note==null?'':String(t.note), stateTs: Number(t.stateTs)||0, noteTs: Number(t.noteTs)||0};
    });
  }
  return out;
}
function normalizeHealthHistory(o){
  if(!o || typeof o !== 'object') return {};
  if(Array.isArray(o)) return {};
  // 旧损坏：整条是当日对象（含 noSnack/weight 但无日期键）
  if(o[TODAY]===undefined && ('noSnack' in o || 'weight' in o)){
    let w = (o.weight==null||isNaN(Number(o.weight)))?null:Number(o.weight);
    return { [TODAY]: {noSnack:false, intermittent:false, weight:w, noSnackTs:0, intermittentTs:0, weightTs:0} };
  }
  let out = {};
  for(let k in o){
    if(!DATE_KEY_RE.test(k)) continue;
    let v = o[k];
    // corrupted：值里又嵌了日期键，或根本不是对象
    if(!v || typeof v !== 'object' || Array.isArray(v) || Object.keys(v).some(kk=>DATE_KEY_RE.test(kk))){
      let w = null;
      if(v && typeof v==='object' && !Array.isArray(v) && v.weight!=null && !isNaN(Number(v.weight))) w = Number(v.weight);
      out[k] = {noSnack:false, intermittent:false, weight:w, noSnackTs:0, intermittentTs:0, weightTs:0};
      continue;
    }
    out[k] = {
      noSnack: !!v.noSnack,
      intermittent: !!v.intermittent,
      weight: (v.weight==null||isNaN(Number(v.weight)))?null:Number(v.weight),
      noSnackTs: Number(v.noSnackTs)||0,
      intermittentTs: Number(v.intermittentTs)||0,
      weightTs: Number(v.weightTs)||0
    };
  }
  return out;
}

// 合并两个 localStorage 原始字符串值（a=本地, b=云端）
function mergeRaw(a,b){
  let pa,pb;
  try{ pa=JSON.parse(a); }catch{ pa=undefined; }
  try{ pb=JSON.parse(b); }catch{ pb=undefined; }
  if(pa!==undefined && pb!==undefined && typeof pa==='object' && typeof pb==='object'){
    return JSON.stringify(deepObjMerge(pa,pb));
  }
  if(a && a!=='null' && a!=='""' && a!=='{}') return a;
  if(b && b!=='null' && b!=='""' && b!=='{}') return b;
  return a || b || '';
}

function syncCollect(){
  let o={};
  for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); o[k]=localStorage.getItem(k); }
  return o;
}
function setSyncStatus(txt, ok=true){
  let el=document.getElementById('syncStatus');
  if(el){ el.textContent=txt; el.style.color = ok?'#4285f4':'#e8603c'; }
}
function syncMarkDirty(){
  if(!SYNC) return;
  setSyncStatus('有改动，同步中…');
  scheduleSync();
}

async function ghFetch(path, opts={}){
  let cfg=getCfg();
  opts.headers = Object.assign({'Accept':'application/vnd.github+json','User-Agent':'workbench','Authorization':'Bearer '+(cfg.token||'')}, opts.headers||{});
  return fetch(GH_API+path, opts);
}
// base64 编解码（兼容中文 UTF-8）
function b64encodeUtf8(str){
  let bytes=new TextEncoder().encode(str);
  let bin='';
  for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decodeUtf8(b64){
  let bin=atob(b64.replace(/\s/g,''));
  let bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
let _branchOk=false;
async function repoBranchEnsure(){
  if(_branchOk) return;
  let r=await ghFetch(`/repos/${SYNC_OWNER}/${SYNC_REPO}/git/refs/heads/${SYNC_BRANCH}`);
  if(r.ok){ _branchOk=true; return; }
  let mainRes=await ghFetch(`/repos/${SYNC_OWNER}/${SYNC_REPO}/git/refs/heads/main`);
  let mainSha=(await mainRes.json()).object.sha;
  await ghFetch(`/repos/${SYNC_OWNER}/${SYNC_REPO}/git/refs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:`refs/heads/${SYNC_BRANCH}`,sha:mainSha})});
  _branchOk=true;
}
async function repoPull(bust){
  try{
    let url=`/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}?ref=${SYNC_BRANCH}`;
    if(bust) url += '&_='+Date.now();          // 破坏 CDN 缓存，确保读到云端最新值（陈旧读取曾把云端旧值当最新）
    let r=await ghFetch(url, bust?{headers:{'Cache-Control':'no-cache'}}:{});
    if(!r.ok) return {};
    let j=await r.json();
    let content=j.content? b64decodeUtf8(j.content) : '{}';
    return JSON.parse(content);
  }catch(e){ return {}; }
}
async function repoPush(obj){
  await repoBranchEnsure();
  let sha=null;
  try{
    let r=await ghFetch(`/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}?ref=${SYNC_BRANCH}&_=${Date.now()}`,{headers:{'Cache-Control':'no-cache'}});
    if(r.ok) sha=(await r.json()).sha;
  }catch(e){}
  await ghFetch(`/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'sync '+new Date().toISOString(),content:b64encodeUtf8(JSON.stringify(obj)),branch:SYNC_BRANCH,sha:sha||undefined})});
}

// 自动同步：拉云端 → 合并 → 写本地+刷新 → 推云端
let _syncing = false;
let _needResync = false;   // 同步进行中若又有本地写入，结束后补推一次（防止关闭时漏存）
let _syncDebounce = null;
// 数据改动后 5 秒自动触发一次同步（与 30 秒定时互补，减少手动等待）
function scheduleSync(){
  if(_syncDebounce) clearTimeout(_syncDebounce);
  _syncDebounce = setTimeout(()=>{ syncNow(); }, 5000);
}
async function syncNow(){
  if(_syncing) return;
  let cfg=getCfg();
  if(!cfg.token){ return; }            // 未配置 Token 时静默，不弹框打断
  if(!navigator.onLine){ return; }
  _syncing = true;
  setSyncStatus('同步中…');
  try{
    let cloud = await repoPull(true);  // 缓存破坏，读云端最新值
    let local = syncCollect();   // 同步开始时的本地快照
    // 上次成功同步后的基线（用于三方合并，避免依赖设备时钟）
    let base = {};
    try{ base = JSON.parse(localStorage.getItem('wb_sync_baseline')||'{}')||{}; }catch{}
    // 本机编辑保护（关键修复）：只要某键存在「尚未确认已安全上云的本机编辑」就强制保留本机值。
    // 旧逻辑用全局时间戳 wb_last_sync_ok 比较，首次同步成功后该时间戳越过编辑时间，
    // 保护被提前解除 → 随后一次陈旧的云端读取把本机值还原成旧值（开着不动 10~30 秒被清空）。
    // 新逻辑：保护持续到「重新读取云端确认该键已是本机值」才解除，期间绝不因陈旧云端而回滚。
    let localEdit = getLocalEdit();
    let normPlan = (x)=>{ try{ return JSON.stringify(normalizePlanHistory(JSON.parse(x||'{}'))); }catch{ return x; } };
    let normHealth = (x)=>{ try{ return JSON.stringify(normalizeHealthHistory(JSON.parse(x||'{}'))); }catch{ return x; } };
    // 三方合并：以「自上次同步后谁改过」判定，完全不依赖设备时钟
    function threeWay(k, l, c, b){
      if(k==='wb_plan_history' || k==='wb_health_history'){
        let ln=(k==='wb_plan_history')?normPlan(l):normHealth(l);
        let cn=(k==='wb_plan_history')?normPlan(c):normHealth(c);
        let bn=(k==='wb_plan_history')?normPlan(b):normHealth(b);
        if(ln===cn) return ln;                  // 完全一致
        if(c===undefined) return ln;            // 云端无此键 → 本地优先（防误删）
        if(ln===bn) return cn;                  // 仅云端改过 → 听云端
        if(cn===bn) return ln;                  // 仅本地改过 → 听本地
        return mergeRaw(ln,cn);                 // 两边都改（冲突）→ 本地优先
      }
      if(l===c) return l;
      if(c===undefined) return l;               // 云端无此键 → 保留本地（防误删）
      if(l===b) return c;                       // 仅云端改过 → 听云端
      if(c===b) return l;                       // 仅本地改过 → 听本地
      return l;                                 // 冲突 → 本地优先
    }
    let keys = new Set([...Object.keys(local), ...Object.keys(cloud)]);
    let merged = {};
    keys.forEach(k=>{
      if(k.indexOf('wb_sync')===0 || k==='wb_last_sync') return;   // 跳过内部键
      merged[k] = threeWay(k, local[k], cloud[k], base[k]);
    });
    // 写回阶段：重新读取当前本地值。
    let finalMerged = {};
    for(let k in merged){
      let cur = localStorage.getItem(k);
      let protectedLocal = !!localEdit[k];        // 存在未确认本机编辑 → 强制保留本机值并推云端
      let val;
      if(protectedLocal){ val = cur; }
      else if(cur!==local[k]){ val = threeWay(k, cur, cloud[k], base[k]); }  // 同步途中改过 → 用最新本地值重做合并
      else { val = merged[k]; }
      finalMerged[k] = val;
      if(val!==undefined) localStorage.setItem(k, val);
    }
    setCfg(cfg);
    // 正在输入备注时不强制重渲染，避免移动端失焦/清空
    let ae = document.activeElement;
    let typing = ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT');
    renderSidebar();
    if(!typing) renderActiveTab();
    // 仅当 finalMerged 与云端（规范化后）不一致才推送，减少无意义提交
    let changed=false;
    for(let k of Object.keys(finalMerged)){
      let cv = cloud[k];
      if(k==='wb_plan_history') cv=normPlan(cv);
      else if(k==='wb_health_history') cv=normHealth(cv);
      if(finalMerged[k]!==cv){ changed=true; break; }
    }
    let toClear = [];   // 已确认安全上云、可解除本机编辑保护的键
    let pushOk = !changed;   // 无改动视为已同步
    if(changed){
      try{
        await repoPush(finalMerged);
        localStorage.setItem('wb_sync_baseline', JSON.stringify(finalMerged));   // 推送成功才更新基线
        // 重新读取云端，确认我们写的值真的上去了（破除 CDN 陈旧），再解除本机编辑保护
        let verify = await repoPull(true);
        for(let k in finalMerged){
          let cv = verify[k];
          if(k==='wb_plan_history') cv=normPlan(cv);
          else if(k==='wb_health_history') cv=normHealth(cv);
          if(finalMerged[k]===cv) toClear.push(k);
        }
        pushOk = true;
      }catch(e){
        setSyncStatus('同步失败（改动已存本地，稍后自动重试）', false);   // 推送失败不解除保护，下次重试
        pushOk = false;
      }
    }else{
      localStorage.setItem('wb_sync_baseline', JSON.stringify(finalMerged));     // 无变化也播种基线，便于后续检测本地改动
      // 无改动：若本机值与（已缓存破坏的）云端一致，说明该键已同步，解除可能的旧保护
      for(let k in finalMerged){
        let cv = cloud[k];
        if(k==='wb_plan_history') cv=normPlan(cv);
        else if(k==='wb_health_history') cv=normHealth(cv);
        if(finalMerged[k]===cv) toClear.push(k);
      }
    }
    // 解除已确认安全的键的保护（仅这些键会重新接受云端改动）
    if(toClear.length){
      let m=getLocalEdit();
      toClear.forEach(k=>{ delete m[k]; });
      localStorage.setItem('wb_local_edit', JSON.stringify(m));
    }
    localStorage.setItem('wb_last_sync_ok', String(Date.now()));
    let t=new Date();
    localStorage.setItem('wb_last_sync', t.toISOString());
    let hh=String(t.getHours()).padStart(2,'0'), mm=String(t.getMinutes()).padStart(2,'0');
    if(pushOk) setSyncStatus((changed?'已同步 ':'已是最新 ')+hh+':'+mm);
  }catch(e){
    setSyncStatus('同步失败：'+(e.stack||e.message||'网络错误').split('\n')[0], false);
    console.error('sync error', e);
  }finally{
    _syncing = false;
    if(_needResync){ _needResync = false; syncNow(); }   // 同步途中发生的本地改动，结束后补推，避免关闭时漏存
  }
}

function openSyncSettings(){
  let cfg=getCfg();
  let token = prompt('粘贴 GitHub Token（需对 '+SYNC_OWNER+'/'+SYNC_REPO+' 仓库有 Contents 读写权限；细粒度 Token 选该仓库 Read and write 即可）：\n\n数据将同步到仓库的 '+SYNC_BRANCH+' 分支（不影响网页本身）。', cfg.token||'');
  if(token===null) return;
  token=token.trim();
  cfg.token=token;
  setCfg(cfg);
  setSyncStatus('已保存，自动同步中…');
  syncNow();
}

async function syncInit(){
  if(!SYNC) return;
  document.getElementById('syncbar').style.display='flex';
  let cfg=getCfg();
  if(!cfg.token){
    setSyncStatus('未配置 Token，点「设置」');
  }else{
    let last=localStorage.getItem('wb_last_sync');
    if(last){ let t=new Date(last); setSyncStatus('上次同步 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')); }
    else setSyncStatus('未同步');
    // 每 30 秒自动同步一次
    setInterval(syncNow, 30000);
    syncNow();
  }
}

function exportData(){
  let data=syncCollect();
  let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='暴躁汤工作台数据备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
async function importData(input){
  let file=input.files[0];
  if(!file) return;
  let reader=new FileReader();
  reader.onload=async (e)=>{
    try{
      let obj=JSON.parse(e.target.result);
      localStorage.clear(); setCfg(getCfg());
      for(let k in obj) localStorage.setItem(k, obj[k]);
      await repoPush(syncCollect());
      alert('导入成功，已同步到云端');
      location.reload();
    }catch(err){ alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  input.value='';
}

// ============ Tab1: 重启计划 ============
// plan_history: { date: [ {state, note} ] }  索引0-5是普通任务
// 注意：所有写入都必须保存「完整日期对象」(h)，不能只保存当日切片(arr)，否则会破坏结构
// 日期键正则：用于过滤/校验历史记录对象
const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;

function getPlanStore(){
  let D = VIEW;
  let h = normalizePlanHistory(ls('wb_plan_history'));
  if(!Array.isArray(h[D])){
    if(D !== TODAY) return {h, arr:null};   // 往期无记录 → 返回 null
    h[D] = PLAN_TASKS.slice(0,6).map(()=>({state:0,note:'',stateTs:0,noteTs:0}));
    ls('wb_plan_history', h);               // 今天首次：写入默认值
  }
  let arr = h[D];
  return {h, arr};
}
function getPlanToday(){ return getPlanStore().arr; }
function getHealthStore(){
  let D = VIEW;
  let h = normalizeHealthHistory(ls('wb_health_history'));
  if(!h[D] || typeof h[D] !== 'object' || Array.isArray(h[D])){
    if(D !== TODAY) return {h, obj:null};
    h[D] = {noSnack:false, intermittent:false, weight:null, noSnackTs:0, intermittentTs:0, weightTs:0};
    ls('wb_health_history', h);             // 今天首次：写入默认值
  }
  let obj = h[D];
  return {h, obj};
}
function getHealthToday(){ return getHealthStore().obj; }
function getWeightHistory(){
  return ls('wb_weight_history') || {};
}

// 计算完成率（0-5 + 健康2项 = 8项可完成，体重曲线不算），按当前 VIEW 日期
function calcDailyRate(){
  let today = getPlanToday();
  let ht = getHealthToday();
  if(!today) return 0;
  let done = today.filter(t=>t&&t.state===2).length;
  if(ht && ht.noSnack) done++;
  if(ht && ht.intermittent) done++;
  return Math.round(done/8*100);
}

// 渲染重启计划
function renderPlan(){
  VIEW = tabD();
  let today = getPlanToday();
  let ht = getHealthToday();
  let hadRecord = !!today;
  if(!today) today = [];
  if(!ht) ht = {noSnack:false, intermittent:false, weight:null};
  let wh = getWeightHistory();
  let pct = calcDailyRate();
  let past = !canEdit();
  let ro = past ? 'readonly' : '';
  let rateColor = pct>=80?'#4caf50':pct>=50?'#ff9800':'#9e9e9e';
  let rateBg = pct>=80?'#e8f5e9':pct>=50?'#fff3e0':'#f5f5f5';
  let rateLabel = past ? (hadRecord?`当日 ${pct}%`:'当日 —') : `今日 ${pct}%`;
  let resetBtn = (!past && hadRecord) ? `<button class="date-today" style="margin-left:8px" onclick="resetTodayPlan()">重置今日状态</button>` : '';
  let html = dateBarHtml();
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:17px;font-weight:700">🔥 重启计划</div>
    <div style="display:flex;align-items:center">
      <div style="font-size:13px;font-weight:600;padding:4px 10px;border-radius:12px;background:${rateBg};color:${rateColor}">${rateLabel}</div>
      ${resetBtn}
    </div>
  </div>`;
  if(!hadRecord){
    html += `<div class="empty-state"><div class="icon">🔥</div><p>${VIEW} 无任务记录</p></div>`;
  }

  // 0-5: 普通任务
  for(let i=0;i<6;i++){
    let t = today[i];
    if(!t){ t = {state:0,note:''}; }
    let chkClass = t.state===2 ? 'checked' : t.state===1 ? 'incomplete' : '';
    let itemClass = t.state===1 ? 'incomplete-state' : '';
    html += `<div class="task-item ${itemClass}" data-idx="${i}">
      <div class="task-content">
        <div class="task-checkbox ${chkClass}" onclick="togglePlan(${i})"></div>
        <div style="flex:1">
          <div class="task-text ${t.state===2?'done':''} ${t.state===1?'incomplete':''}" onclick="showPlanStats(${i})">${PLAN_TASKS[i]}</div>
          <textarea class="task-note-input" rows="1" placeholder="完成心得/具体内容..." oninput="savePlanNote(${i},this.value)" onfocus="this.rows=2" onblur="if(!this.value)this.rows=1">${t.note||''}</textarea>
        </div>
      </div>
    </div>`;
  }

  // 6: 健康饮食
  let health = ht;
  let prevWeight = null;
  // 找前一天的体重（相对当前查看日期 VIEW）
  let allDates = Object.keys(wh).filter(d=>wh[d]!=null).sort();
  for(let d=allDates.length-1;d>=0;d--){
    if(allDates[d]<VIEW && wh[allDates[d]]!==null && wh[allDates[d]]!==undefined){prevWeight=wh[allDates[d]];break;}
  }
  let curWeight = health.weight != null ? health.weight : wh[VIEW];
  let arrow = '';
  if(curWeight){
    if(prevWeight){
      let diff = curWeight - prevWeight;
      if(diff>0) arrow = `<span class="weight-arrow up">↑${diff.toFixed(2)}kg</span>`;
      else if(diff<0) arrow = `<span class="weight-arrow down">↓${Math.abs(diff).toFixed(2)}kg</span>`;
      else arrow = `<span class="weight-arrow flat">→0.00kg</span>`;
    } else {
      arrow = `<span class="weight-arrow flat">→无昨日数据</span>`;
    }
  }
  html += `<div class="task-item" style="overflow:visible">
    <div class="task-content" style="flex-direction:column;align-items:stretch;min-height:auto;padding:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div class="task-checkbox ${(health.noSnack&&health.intermittent&&curWeight)?'checked':''}" onclick="checkHealthAll()"></div>
        <div class="task-text" style="font-weight:600">健康饮食</div>
      </div>
      <div class="health-row" style="flex-wrap:wrap">
        <div class="health-tag" style="cursor:pointer" onclick="toggleHealth('noSnack')">
          <span class="label">无零食</span>
          <div class="tag-check ${health.noSnack?'blue':''}"></div>
        </div>
        <div class="health-tag" style="cursor:pointer" onclick="toggleHealth('intermittent')">
          <span class="label">16+8</span>
          <div class="tag-check ${health.intermittent?'blue':''}"></div>
        </div>
      </div>
      <div class="health-row" style="padding-top:2px">
        <div class="weight-input">
          <span>早体重</span>
          <input type="text" inputmode="decimal" placeholder="kg" value="${curWeight||''}" ${ro} oninput="saveWeight(this.value)" onblur="saveWeightCommit(this)">
          <span id="weightArrow">${arrow}</span>
        </div>
      </div>
    </div>
  </div>`;

  // 7: 体重曲线图
  html += `<div class="chart-section">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px">📊 体重曲线图</div>
    <div class="chart-tabs" id="chartTabs">
      <button class="chart-tab active" onclick="switchChartRange('week')">周</button>
      <button class="chart-tab" onclick="switchChartRange('month')">月</button>
      <button class="chart-tab" onclick="switchChartRange('year')">年</button>
    </div>
    <div class="chart-nav">
      <button class="chart-nav-btn" onclick="chartPrev()">◀</button>
      <div class="chart-period" id="chartPeriodLabel"></div>
      <button class="chart-nav-btn" onclick="chartNext()">▶</button>
    </div>
    <div class="chart-container"><svg id="weightSvg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet"></svg></div>
  </div>`;

  // 备注区
  let notes = lsRaw(`wb_notes_plan_${VIEW}`);
  html += `<div class="notes-section">
    <label>📝 ${past?'当日':'今日'}备注 / 心得</label>
    <textarea class="notes-box" ${ro} oninput="lsRaw('wb_notes_plan_${VIEW}',this.value)" placeholder="记录完成情况...">${notes}</textarea>
  </div>`;

  document.getElementById('contentArea').innerHTML = html;
  // 健康饮食不需要滑动删除
  chartOffset = 0;
  currentChartRange = 'week';
  renderWeightChart();
}

function togglePlan(i){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let {h, arr} = getPlanStore();
  if(!arr) return;
  let t = arr[i];
  t.state = (t.state===undefined?0:t.state)+1;
  if(t.state>2) t.state=0;
  t.stateTs = Date.now();
  ls('wb_plan_history', h);
  renderPlan();
}
function savePlanNote(i,val){
  if(!canEdit()) return;
  let {h, arr} = getPlanStore();
  if(!arr) return;
  arr[i].note = val;
  arr[i].noteTs = Date.now();
  ls('wb_plan_history', h);
}

function toggleHealth(field){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let {h, obj} = getHealthStore();
  if(!obj) return;
  obj[field] = !obj[field];
  obj[field+'Ts'] = Date.now();
  ls('wb_health_history', h);
  renderPlan();
}
function checkHealthAll(){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let {h, obj} = getHealthStore();
  if(!obj) return;
  let allDone = obj.noSnack && obj.intermittent && obj.weight;
  obj.noSnack = !allDone;
  obj.intermittent = !allDone;
  obj.noSnackTs = Date.now();
  obj.intermittentTs = Date.now();
  ls('wb_health_history', h);
  renderPlan();
}
function resetTodayPlan(){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  if(!confirm('确定重置今日重启计划的所有勾选状态？\n（备注、体重记录会保留，并会同步到其他设备）')) return;
  let now = Date.now();
  let ps = getPlanStore();
  if(ps.arr){
    ps.arr.forEach(t=>{ t.state = 0; t.stateTs = now; });
    ls('wb_plan_history', ps.h);
  }
  let hs = getHealthStore();
  if(hs.obj){
    hs.obj.noSnack = false; hs.obj.noSnackTs = now;
    hs.obj.intermittent = false; hs.obj.intermittentTs = now;
    // 体重保留，不重置
    ls('wb_health_history', hs.h);
  }
  renderPlan();
  toast('今日状态已重置');
}
function saveWeight(val){
  if(!canEdit()) return;
  let {h, obj} = getHealthStore();
  if(!obj) return;
  let w = parseFloat(val);
  obj.weight = isNaN(w)?null:w;
  obj.weightTs = Date.now();
  ls('wb_health_history', h);
  let wh = getWeightHistory();
  wh[VIEW] = isNaN(w)?null:w;
  ls('wb_weight_history', wh);
  // 只更新箭头和图表，不重渲染（避免输入框失焦）
  updateWeightArrow(isNaN(w)?null:w);
  renderWeightChart();
}
function saveWeightCommit(input){
  if(!canEdit()) return;
  // 输入完成时清洗并回写
  let v = input.value.trim();
  if(v==='') return;
  if(!/^\d+(\.\d{0,2})?$/.test(v)){
    // 非法值：清理为只保留数字+单个小数点+最多2位小数
    let cleaned = v.replace(/[^0-9.]/g,'');
    let parts = cleaned.split('.');
    if(parts.length>2) cleaned = parts[0]+'.'+parts.slice(1).join('');
    if(cleaned.includes('.')){
      let [a,b] = cleaned.split('.');
      cleaned = a+'.'+(b||'').slice(0,2);
    }
    input.value = cleaned;
    saveWeight(cleaned);
  }
}
function updateWeightArrow(curWeight){
  let arrowEl = document.getElementById('weightArrow');
  if(!arrowEl) return;
  let wh = getWeightHistory();
  let dates = Object.keys(wh).filter(d=>wh[d]!==null&&wh[d]!==undefined).sort();
  let prevWeight = null;
  for(let i=dates.length-1;i>=0;i--){
    if(dates[i]<TODAY && wh[dates[i]]!==null){prevWeight=wh[dates[i]];break;}
  }
  let html='';
  if(curWeight!==null && curWeight!==undefined){
    if(prevWeight){
      let diff = curWeight - prevWeight;
      if(diff>0) html = `<span class="weight-arrow up">↑${diff.toFixed(2)}kg</span>`;
      else if(diff<0) html = `<span class="weight-arrow down">↓${Math.abs(diff).toFixed(2)}kg</span>`;
      else html = `<span class="weight-arrow flat">→0.00kg</span>`;
    } else {
      html = `<span class="weight-arrow flat">→无昨日数据</span>`;
    }
  }
  arrowEl.innerHTML = html;
}

function showPlanStats(i){
  let h = ls('wb_plan_history')||{};
  let dates = Object.keys(h).sort();
  let totalDays = dates.length;
  let completed = dates.filter(d=>h[d][i]&&h[d][i].state===2).length;
  let rate = totalDays===0?0:Math.round(completed/totalDays*100);
  let card = document.getElementById('statsCard');
  card.innerHTML = `
    <div class="task-name">${PLAN_TASKS[i]}</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${totalDays}</div><div class="lbl">记录天数</div></div>
      <div class="stat-box"><div class="val">${completed}</div><div class="lbl">完成次数</div></div>
    </div>
    <div class="rate-bar"><div class="rate-fill" style="width:${rate}%"></div></div>
    <div class="rate-label">总完成率 ${rate}%</div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" onclick="document.getElementById('statsOverlay').classList.remove('show')">关闭</button>
    </div>`;
  document.getElementById('statsOverlay').classList.add('show');
}

function switchChartRange(range){
  currentChartRange = range;
  chartOffset = 0;
  document.querySelectorAll('.chart-tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderWeightChart();
}
function chartPrev(){ chartOffset--; renderWeightChart(); }
function chartNext(){ chartOffset++; renderWeightChart(); }

function getWeekRange(offset){
  let d = new Date(TODAY + 'T00:00:00');
  d.setDate(d.getDate() + offset*7);
  // 以自然周（周一~周日）为准
  let day = d.getDay(); // 0=周日 1=周一 ... 6=周六
  let diffToMonday = (day === 0) ? -6 : (1 - day);
  let start = new Date(d); start.setDate(start.getDate() + diffToMonday);
  let end = new Date(start); end.setDate(start.getDate() + 6);
  function fmt(x){return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
  return {start: fmt(start), end: fmt(end), label: `${fmt(start).slice(5)} ~ ${fmt(end).slice(5)}`};
}
function getMonthRange(offset){
  let d = new Date(TODAY);
  d.setMonth(d.getMonth() + offset, 1);
  let y = d.getFullYear(), m = d.getMonth();
  let daysInMonth = new Date(y, m+1, 0).getDate();
  let start = `${y}-${String(m+1).padStart(2,'0')}-01`;
  let end = `${y}-${String(m+1).padStart(2,'0')}-${daysInMonth}`;
  let mName = `${y}年${m+1}月`;
  return {start, end, label: mName, daysInMonth, y, m};
}
function getYearRange(offset){
  let d = new Date(TODAY);
  let y = d.getFullYear() + offset;
  return {start: `${y}-01-01`, end: `${y}-12-31`, label: `${y}年`, y};
}

function renderWeightChart(){
  let wh = getWeightHistory();
  let dates = Object.keys(wh).filter(d=>wh[d]!==null&&wh[d]!==undefined).sort();
  let labels=[], data=[], periodLabel='';
  
  if(currentChartRange==='week'){
    let range = getWeekRange(chartOffset);
    periodLabel = range.label;
    const weekDays = ['日','一','二','三','四','五','六'];
    // 当前周 7 天全部显示，无数据留空
    let cur = new Date(range.start+'T00:00:00');
    let end = new Date(range.end+'T00:00:00');
    function localDateStr(dt){
      return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    }
    while(cur<=end){
      let d = localDateStr(cur);
      let day = cur.getDay();
      labels.push({date:d.slice(5), day:`周${weekDays[day]}`});
      data.push(wh[d]!==null&&wh[d]!==undefined?wh[d]:null);
      cur.setDate(cur.getDate()+1);
    }
  } else if(currentChartRange==='month'){
    let range = getMonthRange(chartOffset);
    periodLabel = range.label;
    // 显示该月每天的数据
    for(let day=1;day<=range.daysInMonth;day++){
      let dateStr = `${range.y}-${String(range.m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      labels.push(String(day));
      data.push(wh[dateStr]!==null&&wh[dateStr]!==undefined?wh[dateStr]:null);
    }
  } else if(currentChartRange==='year'){
    let range = getYearRange(chartOffset);
    periodLabel = range.label;
    // 每月平均值
    for(let m=0;m<12;m++){
      let mStr = String(m+1).padStart(2,'0');
      let mDates = dates.filter(d=>d.startsWith(`${range.y}-${mStr}`));
      if(mDates.length>0){
        let avg = mDates.reduce((s,d)=>s+wh[d],0)/mDates.length;
        labels.push(`${m+1}月`);
        data.push(Math.round(avg*100)/100);
      } else {
        labels.push(`${m+1}月`);
        data.push(null);
      }
    }
  }

  let periodEl = document.getElementById('chartPeriodLabel');
  if(periodEl) periodEl.textContent = periodLabel;

  // SVG 折线图（横线连接，无曲线）
  let svgEl = document.getElementById('weightSvg');
  if(!svgEl) return;
  let W=400, H=200, padL=38, padR=14, padT=14, padB=36;
  let plotW = W - padL - padR;
  let plotH = H - padT - padB;
  let pts = [];
  for(let i=0;i<labels.length;i++){
    if(data[i]!==null&&data[i]!==undefined) pts.push({idx:i, v:data[i]});
  }
  let out = '';
  if(pts.length===0){
    out = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#999" font-size="13">暂无数据，先记几天体重吧~</text>`;
    svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svgEl.innerHTML = out;
    return;
  }
  let vals = pts.map(p=>p.v);
  let yMin = Math.min(...vals) - 1;
  let yMax = Math.max(...vals) + 1;
  let yRange = yMax - yMin;
  let n = labels.length;
  let xAt = (i) => n===1 ? padL + plotW/2 : padL + plotW * i / (n-1);
  let yAt = (v) => padT + plotH - ((v - yMin) / yRange) * plotH;
  // Y轴网格+刻度
  for(let i=0;i<=4;i++){
    let v = yMin + yRange * i/4;
    let yp = yAt(v);
    out += `<line x1="${padL}" y1="${yp}" x2="${W-padR}" y2="${yp}" stroke="#f0f0f0" stroke-width="1"/>`;
    out += `<text x="${padL-6}" y="${yp+3}" text-anchor="end" fill="#999" font-size="10">${v.toFixed(1)}</text>`;
  }
  // X轴标签
  let step = Math.max(1, Math.ceil(n/8));
  for(let i=0;i<n;i+=step){
    let xp = xAt(i);
    let lbl = labels[i];
    if(typeof lbl==='object'){
      out += `<text x="${xp}" y="${H-padB+12}" text-anchor="middle" fill="#999" font-size="9">${lbl.date}</text>`;
      out += `<text x="${xp}" y="${H-padB+22}" text-anchor="middle" fill="#999" font-size="9">${lbl.day}</text>`;
    } else {
      out += `<text x="${xp}" y="${H-padB+14}" text-anchor="middle" fill="#999" font-size="10">${lbl}</text>`;
    }
  }
  // 折线（直线连接）
  if(pts.length>=2){
    let d = '';
    for(let k=0;k<pts.length;k++){
      let xp = xAt(pts[k].idx);
      let yp = yAt(pts[k].v);
      d += (k===0?'M':'L') + xp.toFixed(1) + ',' + yp.toFixed(1) + ' ';
    }
    out += `<path d="${d}" stroke="#4285f4" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
  }
  // 数据点
  for(let p of pts){
    out += `<circle cx="${xAt(p.idx).toFixed(1)}" cy="${yAt(p.v).toFixed(1)}" r="3.5" fill="#fff" stroke="#4285f4" stroke-width="2"/>`;
  }
  svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svgEl.innerHTML = out;
}

// ============ Tab2: 工作任务 ============
function migrateTaskState(t){
  if(t.state===undefined) t.state = t.done===true ? 2 : 0;
  delete t.done;
  if(t.children) t.children.forEach(migrateTaskState);
}
function getWorkTasks(){
  let tasks = ls(`wb_work_${VIEW}`)||[];
  tasks.forEach(migrateTaskState);
  return tasks;
}
function saveWorkTasks(tasks){
  ls(`wb_work_${VIEW}`,tasks);
}

function renderWork(){
  VIEW = tabD();
  let past = !canEdit();
  let ro = past ? 'readonly' : '';
  let tasks = getWorkTasks();
  let html = dateBarHtml();
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:17px;font-weight:700">工作任务</div>
    ${past?'':`<button class="add-btn" onclick="showAddWorkModal()" title="添加任务">+</button>`}
  </div>`;
  if(tasks.length===0){
    html += `<div class="empty-state"><div class="icon">💼</div><p>暂无任务，点击 + 添加</p></div>`;
  } else {
    tasks.forEach((t,i)=>{
      if(!t) return;
      if(!t.children) t.children=[];
      let pChk = t.state===2?'checked':t.state===1?'incomplete':'';
      let pItemClass = t.state===1?'incomplete-state':'';
      html += `<div class="task-item ${pItemClass}" data-idx="${i}" id="workItem${i}">
        <div class="delete-zone" onclick="deleteWork(${i})">删除</div>
        <div class="task-content">
          <div class="task-checkbox ${pChk}" onclick="toggleWork(${i})"></div>
          <div style="flex:1">
            <div class="task-text ${t.state===2?'done':''} ${t.state===1?'incomplete':''}" onclick="editWorkText(${i},this)">${t.text||'（无标题）'}</div>
          </div>
        </div>`;
      // 子任务
      if(Array.isArray(t.children) && t.children.length>0){
        html += `<div class="subtask-list">`;
        t.children.forEach((c,j)=>{
          if(!c) return;
          let sChk = c.state===2?'checked':c.state===1?'incomplete':'';
          html += `<div class="subtask-item">
            <div class="task-checkbox ${sChk}" onclick="toggleWorkSub(${i},${j})"></div>
            <div class="subtask-text ${c.state===2?'done':''} ${c.state===1?'incomplete':''}" onclick="editWorkSubText(${i},${j},this)">${c.text}</div>
            <span class="sub-del" onclick="deleteWorkSub(${i},${j})">✕</span>
          </div>`;
        });
        html += `</div>`;
      }
      html += `<div class="subtask-add" onclick="showAddSubInput(${i})">
        <span>+ 子任务</span>
      </div>
      <div id="subInput${i}" style="display:none;padding:0 14px 8px 42px">
        <input type="text" placeholder="输入子任务..." id="subInputField${i}" onkeydown="if(event.key==='Enter')addWorkSub(${i});if(event.key==='Escape')this.parentElement.style.display='none'">

      </div>
      <div style="padding:0 14px 10px">
        <textarea class="task-note-input" rows="1" placeholder="完成情况 / 未完成原因..." oninput="saveWorkNote(${i},this.value)" onfocus="this.rows=2" onblur="if(!this.value)this.rows=1">${t.note||''}</textarea>
      </div>
    </div>`;
    });
  }
  let notes = lsRaw(`wb_notes_work_${VIEW}`);
  html += `<div class="notes-section"><label>📝 工作备注</label>
    <textarea class="notes-box" ${ro} oninput="lsRaw('wb_notes_work_${VIEW}',this.value)" placeholder="工作相关备注...">${notes}</textarea></div>`;
  document.getElementById('contentArea').innerHTML = html;
  // 初始化滑动
  tasks.forEach((_,i)=>initSwipe(document.getElementById('workItem'+i),()=>deleteWork(i)));
}

function cycleState(state){ return (state===undefined?0:state)+1 > 2 ? 0 : (state===undefined?0:state)+1; }
function toggleWork(i){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks(); if(!tasks[i]) return;
  tasks[i].state=cycleState(tasks[i].state);saveWorkTasks(tasks);renderWork();
}
function toggleWorkSub(i,j){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks();
  if(!tasks[i] || !tasks[i].children || !tasks[i].children[j]) return;
  let c = tasks[i].children[j];
  c.state = cycleState(c.state);
  // 子项全完成后，一级任务自动完成
  if(tasks[i].children.every(x=>x.state===2)) tasks[i].state=2;
  else if(tasks[i].state===2) tasks[i].state=0;
  saveWorkTasks(tasks);renderWork();
}
function saveWorkNote(i,val){
  if(!canEdit()) return;
  let tasks=getWorkTasks();tasks[i].note=val;saveWorkTasks(tasks);
}
function deleteWork(i){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks();tasks.splice(i,1);saveWorkTasks(tasks);renderWork();
}
function deleteWorkSub(i,j){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks();tasks[i].children.splice(j,1);saveWorkTasks(tasks);renderWork();
}
function editWorkText(i,el){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks();
  let cur=tasks[i].text||'';
  el.innerHTML=`<input type="text" value="${cur}" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:14px;font-family:inherit;outline:none" onblur="finishEditWork(${i},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  el.querySelector('input').focus();
}
function finishEditWork(i,input){
  if(!canEdit()) return;
  let tasks=getWorkTasks();tasks[i].text=input.value.trim()||tasks[i].text;saveWorkTasks(tasks);renderWork();
}
function editWorkSubText(i,j,el){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getWorkTasks();let cur=tasks[i].children[j].text;
  el.innerHTML=`<input type="text" value="${cur}" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:3px;font-size:13px;font-family:inherit;outline:none" onblur="finishEditWorkSub(${i},${j},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  el.querySelector('input').focus();
}
function finishEditWorkSub(i,j,input){
  if(!canEdit()) return;
  let tasks=getWorkTasks();tasks[i].children[j].text=input.value.trim()||tasks[i].children[j].text;saveWorkTasks(tasks);renderWork();
}
function showAddWorkModal(){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  document.getElementById('modalTitle').textContent='添加工作任务';
  document.getElementById('taskInput').value='';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('taskInput').focus(),100);
}
function addWorkFromModal(){
  let text=document.getElementById('taskInput').value.trim();
  if(!text)return;
  let tasks=getWorkTasks();
  tasks.push({text,state:0,children:[],note:''});
  saveWorkTasks(tasks);renderWork();
  document.getElementById('modal').classList.remove('show');
}
function showAddSubInput(i){
  let el=document.getElementById('subInput'+i);
  el.style.display=el.style.display==='none'?'flex':'none';
  if(el.style.display==='flex') document.getElementById('subInputField'+i).focus();
}
function addWorkSub(i){
  let input=document.getElementById('subInputField'+i);
  let text=input.value.trim();if(!text)return;
  let tasks=getWorkTasks();
  if(!tasks[i].children) tasks[i].children=[];
  tasks[i].children.push({text,state:0});
  saveWorkTasks(tasks);renderWork();
}

function seedNum(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function dailyShuffle(arr, seed){ let a=arr.slice(); let s=seed>>>0; for(let i=a.length-1;i>0;i--){ s=(Math.imul(s,1664525)+1013904223)>>>0; let j=s%(i+1); let t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function dailyEnLessons(D){ return dailyShuffle(EN_LESSONS, seedNum('enL'+D)).slice(0,10); }
function enTestType(D, idx){ const t=['mc','blank','zhe']; return t[seedNum('enT'+D+idx)%3]; }

function enKeys(en){ const stop=new Set(['a','an','the','is','am','are','was','were','be','been','being','to','of','in','on','for','and','or','but','we','you','i','it','this','that','these','those','my','your','our','as','at','by','from','with','so','not','no','do','does','did','have','has','had','will','would','can','could','should','may','might','they','he','she','them','us','me','him','her','its','their','per','se','long','all','out','up','if','than','then','there','here','into','about','over','more','most','such','own','now','one','ones','who','whom','which','what','when','where','why','how','today','done','get']); return en.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w&&!stop.has(w)&&w.length>2).slice(0,4); }
function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }

function enToggleLearned(id){ if(!enGuard())return; let s=enLearned(); s[id]=!s[id]; ls('wb_en_learned_'+VIEW,s); renderEn(); }

function enAnsMc(i, oi){
  if(!enGuard())return;
  let items=dailyEnTests(VIEW); let it=items[i];
  let ok = oi===it.les.test.answer;
  let s=enTestState(); s[i]={ans:oi, ok, sub:true}; ls('wb_en_test_'+VIEW,s); renderEn();
}
function enSetAns(i, txt){
  let s=enTestState(); let cur=s[i]||{}; cur.txt=txt; s[i]=cur; ls('wb_en_test_'+VIEW,s);
}
function enSubmitAns(i){
  if(!enGuard())return;
  let items=dailyEnTests(VIEW); let it=items[i]; let keys=enKeys(it.les.en);
  let s=enTestState(); let cur=s[i]||{}; let n=norm(cur.txt);
  if(it.type==='blank'){
    let ans=norm(it.les.blank.word);
    cur.ok = (n===ans)||(ans&&n.indexOf(ans)>=0);
    cur.hit = cur.ok?1:0;
  } else {
    let hit=keys.filter(k=>n.indexOf(k)>=0).length;
    cur.hit=hit; cur.ok = hit===keys.length && n.length>0;
  }
  cur.sub=true; s[i]=cur; ls('wb_en_test_'+VIEW,s); renderEn();
}
function enRetryAns(i){
  let s=enTestState(); let cur=s[i]||{}; cur.sub=false; cur.ok=false; delete cur.txt; s[i]=cur; ls('wb_en_test_'+VIEW,s); renderEn();
}
function enResetTest(){ if(!enGuard())return; ls('wb_en_test_'+VIEW,{}); renderEn(); }

function renderEnTest(){
  let items = dailyEnTests(VIEW);
  let state = enTestState();
  let total = items.length;
  let done=0, correct=0;
  items.forEach((it,i)=>{ let r=state[i]; if(r&&r.sub){ done++; if(r.ok) correct++; } });
  let head = `<div class="en-score"><span>已答 ${done}/${total} ｜ 正确 ${correct}</span>${canEdit()?`<button class="sync-btn" onclick="enResetTest()">重置</button>`:''}</div>`;
  let cards = items.map((it,i)=>{
    let r = state[i];
    let typeLabel = it.type==='mc'?'选择题':(it.type==='blank'?'挖空填空':'中译英');
    let inner='';
    if(it.type==='mc'){
      let t=it.les.test;
      let opts=t.options.map((o,oi)=>{
        let cls='en-opt'; let dis='';
        if(r&&r.sub){ dis='disabled'; if(oi===t.answer) cls+=' correct'; else if(oi===r.ans&&!r.ok) cls+=' wrong'; }
        return `<button class="${cls}" ${dis} onclick="enAnsMc(${i},${oi})">${o}</button>`;
      }).join('');
      let exp = (r&&r.sub)? `<div class="en-explain">${r.ok?'✅':'❌'} 解析：${t.explain}</div>` : '';
      inner = `<div class="q">${i+1}. ${t.q}</div>${opts}${exp}`;
    } else if(it.type==='blank'){
      let b=it.les.blank;
      let prompt=it.les.en.replace(b.word, `____(${b.hint})____`);
      let val = (r&&r.txt!=null)? r.txt : '';
      let dis = (r&&r.sub)? 'disabled':'';
      let cls = 'en-cloze-input' + (r&&r.sub?(r.ok?' ok':' wrong'):'');
      let exp = (r&&r.sub)? `<div class="en-explain">${r.ok?'✅':'❌'} 答案：<b>${b.word}</b></div>`:'';
      let act = (r&&r.sub)? `<button class="en-submit" onclick="enRetryAns(${i})">重答</button>` : `<button class="en-submit" onclick="enSubmitAns(${i})">提交</button>`;
      inner = `<div class="q">${i+1}. 挖空填空：<br><span class="en-zh">${prompt}</span></div>
        <input class="${cls}" ${dis} value="${val.replace(/"/g,'&quot;')}" placeholder="填入被挖掉的单词/短语" oninput="enSetAns(${i},this.value)">${exp}${act}`;
    } else {
      let keys = enKeys(it.les.en);
      let val = (r&&r.txt!=null)? r.txt : '';
      let dis = (r&&r.sub)? 'disabled':'';
      let cls = 'en-zh-input' + (r&&r.sub?(r.ok?' ok':' wrong'):'');
      let keyHint = keys.map(k=>`<span class="en-key">${k}</span>`).join(' ');
      let exp = (r&&r.sub)? `<div class="en-explain">关键词命中 ${r.hit||0}/${keys.length} ${r.ok?'✅':'❌'}　参考：<b>${it.les.en}</b></div>`:'';
      let act = (r&&r.sub)? `<button class="en-submit" onclick="enRetryAns(${i})">重答</button>` : `<button class="en-submit" onclick="enSubmitAns(${i})">提交</button>`;
      inner = `<div class="q">${i+1}. 中译英：<br><span class="en-zh">${it.les.zh}</span></div>
        <div style="margin:6px 0;font-size:12px;color:var(--gray)">提示关键词：${keyHint}</div>
        <input class="${cls}" ${dis} value="${val.replace(/"/g,'&quot;')}" placeholder="写出对应的英文句子" oninput="enSetAns(${i},this.value)">${exp}${act}`;
    }
    return `<div class="en-test-q"><span class="en-tag">${typeLabel}</span>${inner}</div>`;
  }).join('');
  if(total===0) return `<div class="en-empty">暂无测试题</div>`;
  return head + cards;
}

function renderEnShadow(){
  let lessons = dailyEnLessons(VIEW);
  let st = enShadowState();

  let head = `<div class="en-head">🎧 语句跟读：点击「播放原声」听朗读，跟读后点「标记已跟读」。</div>
    <div class="en-subhead">已跟读 <b>${done}</b> / ${lessons.length}${canEdit()?`<button class="en-submit" style="margin-left:auto" onclick="enResetShadow()">重置</button>`:''}</div>`;
  let cards = lessons.map((les,idx)=>{
    let isS = !!st[les.id];
    let btn = canEdit()
      ? `<button class="en-badge ${isS?'on':'off'}" onclick="enToggleShadow('${les.id}')">${isS?'✅ 已跟读':'○ 标记已跟读'}</button>`
      : `<span class="en-badge ${isS?'on':'off'}">${isS?'✅ 已跟读':'○ 未跟读'}</span>`;
    return `<div class="en-lesson">
      <div class="en-sentence">${les.en}</div>
      <div class="en-zh">${les.zh}</div>
      <div class="en-shadow-row">
        <button class="en-play" onclick="enSpeak(${idx})">▶ 播放原声</button>

function enSpeak(idx){
  if(typeof speechSynthesis==='undefined'){ toast('当前浏览器不支持语音朗读'); return; }
  let les = dailyEnLessons(VIEW)[idx];
  if(!les) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  let u = new SpeechSynthesisUtterance(les.en);
  u.lang='en-US'; u.rate=0.92; u.pitch=1;
  speechSynthesis.speak(u);
}
function enToggleShadow(id){ if(!enGuard())return; let s=enShadowState(); s[id]=!s[id]; ls('wb_en_shadow_'+VIEW,s); renderEn(); }
function enResetShadow(){ if(!enGuard())return; ls('wb_en_shadow_'+VIEW,{}); renderEn(); }

function getPyTasks(){
  let tasks = ls(`wb_py_${VIEW}`)||[];
  tasks.forEach(migrateTaskState);
  return tasks;
}
function savePyTasks(tasks){
  ls(`wb_py_${VIEW}`,tasks);
}
function renderPy(){
  VIEW = tabD();
  let past = !canEdit();
  let ro = past ? 'readonly' : '';
  let tasks = getPyTasks();
  let html = dateBarHtml();
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:17px;font-weight:700">Python 学习</div>
    ${past?'':`<button class="add-btn" onclick="showAddPyModal()" title="添加任务">+</button>`}
  </div>`;
  if(tasks.length===0){
    html += `<div class="empty-state"><div class="icon">🐍</div><p>暂无任务，点击 + 添加</p></div>`;
  } else {
    tasks.forEach((t,i)=>{
      if(!t) return;
      let chk = t.state===2?'checked':t.state===1?'incomplete':'';
      let itemClass = t.state===1?'incomplete-state':'';
      html += `<div class="task-item ${itemClass}" id="pyItem${i}">
        <div class="delete-zone" onclick="deletePy(${i})">删除</div>
        <div class="task-content">
          <div class="task-checkbox ${chk}" onclick="togglePy(${i})"></div>
          <div class="task-text ${t.state===2?'done':''} ${t.state===1?'incomplete':''}" onclick="editPyText(${i},this)">${t.text}</div>
        </div>
      </div>`;
    });
  }
  let notes = lsRaw(`wb_notes_py_${VIEW}`);
  html += `<div class="notes-section"><label>📝 学习备注</label>
    <textarea class="notes-box" ${ro} oninput="lsRaw('wb_notes_py_${VIEW}',this.value)" placeholder="学习心得、踩坑记录...">${notes}</textarea></div>`;

  tasks.forEach((_,i)=>initSwipe(document.getElementById('pyItem'+i),()=>deletePy(i)));
}
function togglePy(i){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getPyTasks(); if(!tasks[i]) return;
  tasks[i].state=cycleState(tasks[i].state);savePyTasks(tasks);renderPy();
}
function deletePy(i){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getPyTasks();tasks.splice(i,1);savePyTasks(tasks);renderPy();
}
function editPyText(i,el){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  let tasks=getPyTasks();let cur=tasks[i].text||'';
  el.innerHTML=`<input type="text" value="${cur}" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:14px;font-family:inherit;outline:none" onblur="finishEditPy(${i},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  el.querySelector('input').focus();
}
function finishEditPy(i,input){
  if(!canEdit()) return;
  let tasks=getPyTasks();tasks[i].text=input.value.trim()||tasks[i].text;savePyTasks(tasks);renderPy();
}
function showAddPyModal(){
  if(!canEdit()){ toast('往期记录为只读'); return; }
  document.getElementById('modalTitle').textContent='添加 Python 任务';
  document.getElementById('taskInput').value='';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('taskInput').focus(),100);
}
function addPyFromModal(){
  let text=document.getElementById('taskInput').value.trim();
  if(!text)return;
  let tasks=getPyTasks();
  tasks.push({text,state:0});
  savePyTasks(tasks);renderPy();
  document.getElementById('modal').classList.remove('show');
}

    <div style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)">添加阅读记录</div>
    <input type="text" id="readTitle" placeholder="书名 / 文章标题" style="width:100%;margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;box-sizing:border-box">
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" id="readAuthor" placeholder="作者（可选）" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px">
      <input type="text" id="readProgress" placeholder="进度（如 P120 / 30%）" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px">
    </div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px">标签（选一项）</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
      ${READ_TAGS.map(t=>{
        let active = _selectedReadTag===t.key;
        return `<button type="button" class="read-tag-btn${active?' active':''}" data-tag="${t.key}" onclick="selectReadTag('${t.key}')" style="padding:4px 10px;border-radius:12px;border:1px solid ${active?t.color:'#ddd'};background:${active?t.color+'15':'#fff'};color:${active?t.color:'#555'};font-size:12px;cursor:pointer;font-family:inherit">${t.label}</button>`;
      }).join('')}
    </div>
    <textarea id="readContent" rows="2" placeholder="摘录原文 / 核心内容..." style="width:100%;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);padding:8px;font-family:inherit;font-size:13px;box-sizing:border-box;resize:vertical"></textarea>
    <textarea id="readInsight" rows="2" placeholder="我的感悟 / 思考..." style="width:100%;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);padding:8px;font-family:inherit;font-size:13px;box-sizing:border-box;resize:vertical"></textarea>
    <textarea id="readAction" rows="2" placeholder="行动 / 应用计划..." style="width:100%;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);padding:8px;font-family:inherit;font-size:13px;box-sizing:border-box;resize:vertical"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-cancel" onclick="toggleReadForm()">取消</button>
      <button class="btn-confirm" onclick="saveReadEntry()">保存</button>
    </div>
  </div>`;

  // 灵感卡片
  let seed = TODAY.split('-').reduce((a,b)=>a+parseInt(b),0);
  let shuffled = READ_PROMPTS.map((p,i)=>({p,i})).sort((a,b)=>{
    let x = Math.sin(seed+a.i)*10000, y = Math.sin(seed+b.i)*10000;
    return (x-Math.floor(x))-(y-Math.floor(y));
  });
  let prompts = shuffled.slice(0,2).map(o=>o.p);
  html += `<div style="background:#fff7ed;border-radius:10px;padding:10px 12px;margin-bottom:12px;border-left:3px solid #ff9800">
    <div style="font-size:12px;font-weight:600;color:#e65100;margin-bottom:4px">💡 今日灵感</div>
    ${prompts.map(p=>`<div style="font-size:12px;color:#5d4037;line-height:1.5;margin-bottom:4px">• ${p}</div>`).join('')}
  </div>`;

  // 记录列表
  if(viewList.length===0){
    html += `<div class="empty-state"><div class="icon">📖</div><p>${past?VIEW+' 无阅读记录':'暂无记录，点击 + 添加第一条'}</p></div>`;
  } else {
    viewList.forEach(({e,i})=>{
      let tag = READ_TAGS.find(t=>t.key===e.tag);
      let tagHtml = tag ? `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:${tag.color}15;color:${tag.color};font-size:11px;font-weight:600;margin-right:6px">${tag.label}</span>` : '';
      html += `<div class="task-item" style="margin-bottom:10px">
        <div class="task-content" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:12px;color:var(--gray)">${e.date}${e.progress?' · '+e.progress:''}</div>
            ${past?'':`<button onclick="deleteReadEntry(${i})" style="background:none;border:none;color:#999;font-size:18px;line-height:1;padding:0 4px;cursor:pointer">×</button>`}
          </div>
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:4px">
            ${tagHtml}
            <div style="font-size:14px;font-weight:600">${e.title||'阅读摘录'}</div>
            ${e.author?`<div style="font-size:12px;color:var(--gray)">by ${e.author}</div>`:''}
          </div>
          ${e.content?`<div style="font-size:13px;line-height:1.6;background:#f5f5f7;border-radius:6px;padding:8px;margin-bottom:6px;color:var(--text)">${e.content}</div>`:''}
          ${e.insight?`<div style="font-size:12px;color:#555;line-height:1.5;margin-bottom:4px"><b>感悟：</b>${e.insight}</div>`:''}
          ${e.action?`<div style="font-size:12px;color:#2e7d32;line-height:1.5;margin-bottom:4px"><b>行动：</b>${e.action}</div>`:''}
          ${e.note?`<div style="font-size:12px;color:#555;line-height:1.5;margin-bottom:4px"><b>备注：</b>${e.note}</div>`:''}
        </div>
      </div>`;
    });
  }
  let notes = lsRaw(`wb_notes_read_${VIEW}`);
  html += `<div class="notes-section"><label>📝 阅读备注</label>
    <textarea class="notes-box" ${past?'readonly':''} oninput="lsRaw('wb_notes_read_${VIEW}',this.value)" placeholder="阅读相关备注...">${notes}</textarea></div>`;
  document.getElementById('contentArea').innerHTML = html;
}

function toggleReadForm(){
  let f = document.getElementById('readForm');
  if(!f) return;
  let showing = f.style.display !== 'none';
  if(showing){
    f.style.display = 'none';
    return;
  }
  _selectedReadTag = '';
  ['readTitle','readAuthor','readProgress','readContent','readInsight','readAction'].forEach(id=>{
    let el = document.getElementById(id);
    if(el) el.value = '';
  });
  document.querySelectorAll('.read-tag-btn').forEach(btn=>{
    btn.style.borderColor = '#ddd';
    btn.style.background = '#fff';
    btn.style.color = '#555';
  });
  f.style.display = 'block';
  setTimeout(()=>document.getElementById('readTitle')?.focus(),50);
}
function selectReadTag(key){
  _selectedReadTag = _selectedReadTag===key?'':key;
  document.querySelectorAll('.read-tag-btn').forEach(btn=>{
    let t = READ_TAGS.find(x=>x.key===btn.dataset.tag);
    let active = btn.dataset.tag===_selectedReadTag;
    btn.style.borderColor = active?t.color:'#ddd';
    btn.style.background = active?t.color+'15':'#fff';
    btn.style.color = active?t.color:'#555';
  });
}
function saveReadEntry(){
  let title = (document.getElementById('readTitle').value||'').trim();
  let content = (document.getElementById('readContent').value||'').trim();
  if(!title && !content){
    alert('请至少填写书名/标题或摘录内容');
    return;
  }
  let entries = ls('wb_read_entries')||[];
  entries.unshift({
    date:TODAY,
    title:title,
    author:(document.getElementById('readAuthor').value||'').trim(),
    progress:(document.getElementById('readProgress').value||'').trim(),
    tag:_selectedReadTag,
    content:content,
    insight:(document.getElementById('readInsight').value||'').trim(),
    action:(document.getElementById('readAction').value||'').trim(),
    note:''
  });
  ls('wb_read_entries',entries);
  _selectedReadTag = '';
  renderRead();
}
function deleteReadEntry(i){
  let entries = ls('wb_read_entries')||[];
  if(confirm('确定删除这条阅读记录吗？')){
    entries.splice(i,1);
    ls('wb_read_entries',entries);renderRead();
  }
}
function saveReadNote(i,val){
  let entries=ls('wb_read_entries')||[];if(entries[i]){entries[i].note=val;ls('wb_read_entries',entries);}
}

// ============ 通用 ============
function renderSidebar(){
  let sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  TABS.forEach(tab=>{
    let btn=document.createElement('button');
    btn.className='tab-btn'+(tab.id===activeTab?' active':'');
    btn.innerHTML=`<span class="tab-icon">${tab.icon}</span><span class="tab-label">${tab.label}</span>`;
    btn.addEventListener('click',()=>{activeTab=tab.id;renderSidebar();renderActiveTab();});
    sb.appendChild(btn);
  });
}

function renderActiveTab(){
  if(activeTab==='plan') renderPlan();
  else if(activeTab==='work') renderWork();
  else if(activeTab==='en') renderEn();
  else if(activeTab==='py') renderPy();
  else if(activeTab==='read') renderRead();
}

// 滑动删除通用
function initSwipe(item,deleteFn){
  if(!item)return;
  let startX=0,currentX=0,isSwiping=false;
  const threshold=40;
  const maxSwipe=56;
  const content=item.querySelector('.task-content');
  function onStart(x){startX=x;currentX=0;isSwiping=true;item.classList.add('swiping')}
  function onMove(x){if(!isSwiping)return;currentX=startX-x;if(currentX<0)currentX=0;if(currentX>maxSwipe)currentX=maxSwipe;content.style.transform=`translateX(-${currentX}px)`}
  function onEnd(){isSwiping=false;item.classList.remove('swiping');if(currentX>=threshold){content.style.transform=`translateX(-${maxSwipe}px)`;content.style.transition='transform .2s';setTimeout(()=>{content.style.transition=''},200)}else{content.style.transform='';content.style.transition='transform .2s';setTimeout(()=>{content.style.transition=''},200)}}
  item.addEventListener('touchstart',e=>{if(e.target.classList.contains('task-checkbox'))return;onStart(e.touches[0].clientX)}, {passive:true});
  item.addEventListener('touchmove',e=>onMove(e.touches[0].clientX),{passive:true});
  item.addEventListener('touchend',onEnd);
  item.addEventListener('mousedown',e=>{if(e.target.classList.contains('task-checkbox')||e.target.classList.contains('task-note-input')||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;onStart(e.clientX);const mh=ev=>onMove(ev.clientX);const eh=()=>{onEnd();window.removeEventListener('mousemove',mh);window.removeEventListener('mouseup',eh)};window.addEventListener('mousemove',mh);window.addEventListener('mouseup',eh)});
}

// 弹窗通用
document.getElementById('cancelBtn').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('show')});
document.getElementById('taskInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(activeTab==='work') addWorkFromModal();
    else if(activeTab==='py') addPyFromModal();
  }
  if(e.key==='Escape') document.getElementById('modal').classList.remove('show');
});
document.getElementById('confirmBtn').addEventListener('click',()=>{
  if(activeTab==='work') addWorkFromModal();
  else if(activeTab==='py') addPyFromModal();
});
document.getElementById('statsOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('statsOverlay'))document.getElementById('statsOverlay').classList.remove('show')});

// === 启动 ===
syncInit().then(()=>{
  renderSidebar();
  renderActiveTab();
});
// 切后台 / 回到前台 / 关闭页面时立即同步：
// 后台与关闭前把本地改动推到云端（避免“关闭再打开偶尔变空”），回到前台时拉取其他设备更新
if(SYNC){
  document.addEventListener('visibilitychange', ()=>{ syncNow(); });
  window.addEventListener('pagehide', ()=>{ syncNow(); });
}
</script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
<div class="pull-indicator" id="pullIndicator">↓ 下拉同步数据</div>
<div class="toast" id="toast"></div>
<script>
// ============ 下拉刷新 = 同步数据 ============
(function(){
  let ca = document.getElementById('contentArea');
  let startY = null, dist = 0, active = false;
  const TH = 64;
  ca.addEventListener('touchstart', e=>{
    if(ca.scrollTop <= 0){ startY = e.touches[0].clientY; active = true; dist = 0; }
  }, {passive:true});
  ca.addEventListener('touchmove', e=>{
    if(!active || startY===null) return;
    let y = e.touches[0].clientY;
    dist = y - startY;
    if(dist > 0 && ca.scrollTop <= 0){
      let ind = document.getElementById('pullIndicator');
      let p = Math.min(dist, TH+40);
      ind.style.transform = 'translateX(-50%) translateY(' + (p-38) + 'px)';
      ind.classList.add('show');
      ind.textContent = dist >= TH ? '↑ 松开同步数据' : '↓ 下拉同步数据';
    }
  }, {passive:true});
  ca.addEventListener('touchend', ()=>{
    let ind = document.getElementById('pullIndicator');
    if(active && dist >= TH){
      ind.textContent = '同步中…';
      if(typeof syncNow === 'function') syncNow().then(()=>{ toast('已同步'); setTimeout(()=>ind.classList.remove('show'), 400); })
                            .catch(()=>{ toast('同步失败'); setTimeout(()=>ind.classList.remove('show'), 400); });
    } else {
      ind.classList.remove('show');
    }
    active = false; startY = null; dist = 0;
  });
})();
</script>
